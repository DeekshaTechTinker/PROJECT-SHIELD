<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Proctoring - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Login Form -->
    <div id="auth-section" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h1 class="text-2xl font-bold mb-6 text-center">Admin Dashboard</h1>
            <input type="text" id="admin-username" placeholder="Admin Username" 
                class="w-full p-3 mb-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="admin-password" placeholder="Password" 
                class="w-full p-3 mb-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="handleAdminLogin()" 
                class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 font-semibold">
                Login as Admin
            </button>
            <div id="auth-message" class="mt-4 text-center text-red-500"></div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-section" class="hidden min-h-screen p-8">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-3xl font-bold mb-6">Admin Risk Dashboard</h1>

            <!-- Users List -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                <h2 class="text-xl font-semibold mb-4">Active Test Takers</h2>
                <div id="users-list" class="space-y-2">
                    <!-- Users will be loaded here -->
                </div>
            </div>

            <!-- Selected User Details -->
            <div id="user-details" class="hidden bg-white rounded-lg shadow-lg p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">User Profile: <span id="selected-username"></span></h2>
                    <button onclick="closeUserDetails()" class="text-gray-500 hover:text-gray-700">✕ Close</button>
                </div>

                <!-- Risk Score Display -->
                <div id="risk-display" class="mb-6 p-4 rounded-lg">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-lg font-semibold">Risk Score:</span>
                        <span id="risk-score-value" class="text-3xl font-bold">-</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-lg font-semibold">Risk Level:</span>
                        <span id="risk-level-value" class="text-2xl font-bold px-4 py-2 rounded">-</span>
                    </div>
                    <div id="risk-details" class="mt-4 text-sm text-gray-600">
                        <!-- Risk details will be shown here -->
                    </div>
                </div>

                <!-- Session Selector -->
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-2">Select Session:</label>
                    <select id="session-selector" onchange="loadSessionData()" 
                        class="w-full p-2 border rounded-lg">
                        <option value="">Select a session...</option>
                    </select>
                </div>

                <!-- Timeline Chart -->
                <div class="mb-6">
                    <h3 class="text-lg font-semibold mb-4">Activity Timeline</h3>
                    <canvas id="timeline-chart" height="100"></canvas>
                </div>

                <!-- Question Timing Table -->
                <div class="mb-6">
                    <h3 class="text-lg font-semibold mb-4">Question Timing Data</h3>
                    <div class="overflow-x-auto">
                        <table id="question-timing-table" class="min-w-full bg-white border rounded-lg">
                            <thead class="bg-gray-100">
                                <tr>
                                    <th class="px-4 py-2 border text-left">Question #</th>
                                    <th class="px-4 py-2 border text-left">Type</th>
                                    <th class="px-4 py-2 border text-left">Answer</th>
                                    <th class="px-4 py-2 border text-left">Time Taken (sec)</th>
                                    <th class="px-4 py-2 border text-left">First Viewed</th>
                                    <th class="px-4 py-2 border text-left">Last Updated</th>
                                </tr>
                            </thead>
                            <tbody id="question-timing-body">
                                <tr>
                                    <td colspan="6" class="px-4 py-2 text-center text-gray-500">No data available</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Event Log -->
                <div>
                    <h3 class="text-lg font-semibold mb-4">Event Log</h3>
                    <div id="event-log" class="max-h-96 overflow-y-auto border rounded p-4 bg-gray-50">
                        <!-- Events will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let authToken = localStorage.getItem('adminToken');
        let selectedUserId = null;
        let selectedSessionId = null;
        let timelineChart = null;

        // Initialize
        if (authToken) {
            showDashboard();
            loadUsers();
        }

        async function handleAdminLogin() {
            const username = document.getElementById('admin-username').value;
            const password = document.getElementById('admin-password').value;
            const messageEl = document.getElementById('auth-message');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (response.ok && data.role === 'admin') {
                    authToken = data.token;
                    localStorage.setItem('adminToken', authToken);
                    showDashboard();
                    loadUsers();
                } else {
                    messageEl.textContent = 'Invalid admin credentials';
                }
            } catch (error) {
                messageEl.textContent = 'Connection error. Please try again.';
            }
        }

        function showDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
        }

        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                const data = await response.json();
                const usersListEl = document.getElementById('users-list');
                usersListEl.innerHTML = '';

                if (data.users && data.users.length > 0) {
                    data.users.forEach(user => {
                        const userCard = document.createElement('div');
                        userCard.className = 'p-4 border rounded-lg hover:bg-gray-50 cursor-pointer';
                        userCard.innerHTML = `
                            <div class="flex justify-between items-center">
                                <div>
                                    <div class="font-semibold">${user.username}</div>
                                    <div class="text-sm text-gray-600">ID: ${user.id}</div>
                                    ${user.session_id ? `<div class="text-sm text-blue-600">Session: ${user.session_id.substring(0, 8)}...</div>` : ''}
                                </div>
                                <div class="text-right">
                                    ${user.status === 'active' ? '<span class="px-2 py-1 bg-green-100 text-green-800 rounded text-sm">Active</span>' : ''}
                                </div>
                            </div>
                        `;
                        userCard.addEventListener('click', () => selectUser(user.id, user.username, user.session_id));
                        usersListEl.appendChild(userCard);
                    });
                } else {
                    usersListEl.innerHTML = '<p class="text-gray-500">No users found</p>';
                }
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        async function selectUser(userId, username, sessionId) {
            selectedUserId = userId;
            document.getElementById('selected-username').textContent = username;
            document.getElementById('user-details').classList.remove('hidden');

            // Load sessions for this user
            await loadUserSessions(userId);
            
            // If there's an active session, select it
            if (sessionId) {
                document.getElementById('session-selector').value = sessionId;
                selectedSessionId = sessionId;
                await loadSessionData();
            }
        }

        async function loadUserSessions(userId) {
            try {
                const response = await fetch(`/api/admin/logs/${userId}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                const data = await response.json();
                const sessions = new Set();
                data.logs.forEach(log => {
                    if (log.session_id) {
                        sessions.add(log.session_id);
                    }
                });

                const selector = document.getElementById('session-selector');
                selector.innerHTML = '<option value="">Select a session...</option>';
                sessions.forEach(sessionId => {
                    const option = document.createElement('option');
                    option.value = sessionId;
                    option.textContent = sessionId.substring(0, 16) + '...';
                    selector.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading sessions:', error);
            }
        }

        async function loadSessionData() {
            const sessionId = document.getElementById('session-selector').value;
            if (!sessionId || !selectedUserId) return;

            selectedSessionId = sessionId;
            await Promise.all([
                loadRiskScore(selectedUserId, sessionId),
                loadLogs(selectedUserId, sessionId),
                loadQuestionResponses(selectedUserId, sessionId)
            ]);
        }

        async function loadQuestionResponses(userId, sessionId) {
            try {
                const response = await fetch(`/api/admin/question-responses/${userId}?session_id=${sessionId}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                const data = await response.json();
                const tbody = document.getElementById('question-timing-body');
                tbody.innerHTML = '';

                if (data.responses && data.responses.length > 0) {
                    data.responses.forEach(resp => {
                        const row = document.createElement('tr');
                        const timeTaken = resp.time_taken_seconds || 0;
                        const minutes = Math.floor(timeTaken / 60);
                        const seconds = timeTaken % 60;
                        const timeDisplay = `${minutes}m ${seconds}s`;
                        
                        const firstViewed = new Date(resp.first_viewed_at).toLocaleString();
                        const lastUpdated = new Date(resp.last_updated_at).toLocaleString();
                        
                        row.innerHTML = `
                            <td class="px-4 py-2 border font-semibold">${resp.question_number}</td>
                            <td class="px-4 py-2 border">${resp.question_type.toUpperCase()}</td>
                            <td class="px-4 py-2 border">${resp.answer || '<span class="text-gray-400">Not answered</span>'}</td>
                            <td class="px-4 py-2 border">${timeDisplay}</td>
                            <td class="px-4 py-2 border text-sm">${firstViewed}</td>
                            <td class="px-4 py-2 border text-sm">${lastUpdated}</td>
                        `;
                        tbody.appendChild(row);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-2 text-center text-gray-500">No question responses recorded</td></tr>';
                }
            } catch (error) {
                console.error('Error loading question responses:', error);
                document.getElementById('question-timing-body').innerHTML = 
                    '<tr><td colspan="6" class="px-4 py-2 text-center text-red-500">Error loading data</td></tr>';
            }
        }

        async function loadRiskScore(userId, sessionId) {
            try {
                const response = await fetch(`/api/admin/risk/${userId}/${sessionId}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                const data = await response.json();
                
                // Update risk display
                document.getElementById('risk-score-value').textContent = data.risk_score;
                const riskLevelEl = document.getElementById('risk-level-value');
                riskLevelEl.textContent = data.risk_level;
                
                // Color coding
                riskLevelEl.className = 'text-2xl font-bold px-4 py-2 rounded';
                if (data.risk_level === 'HIGH') {
                    riskLevelEl.classList.add('bg-red-500', 'text-white');
                } else if (data.risk_level === 'MEDIUM') {
                    riskLevelEl.classList.add('bg-yellow-500', 'text-white');
                } else {
                    riskLevelEl.classList.add('bg-green-500', 'text-white');
                }

                // Risk details with breakdown
                const detailsEl = document.getElementById('risk-details');
                const breakdown = data.details.breakdown || {};
                let breakdownHtml = '';
                
                if (Object.keys(breakdown).length > 0) {
                    breakdownHtml = '<div class="mt-3 pt-3 border-t"><strong>Score Breakdown:</strong><ul class="list-disc list-inside mt-2 space-y-1 text-sm">';
                    if (breakdown.fullscreen_exits) {
                        breakdownHtml += `<li>Fullscreen Exits: +${breakdown.fullscreen_exits} points</li>`;
                    }
                    if (breakdown.tab_switches) {
                        breakdownHtml += `<li>Tab Switches: +${breakdown.tab_switches} points</li>`;
                    }
                    if (breakdown.other_focus_lost) {
                        breakdownHtml += `<li>Other Focus Lost: +${breakdown.other_focus_lost} points</li>`;
                    }
                    if (breakdown.time_spikes) {
                        breakdownHtml += `<li>Time Spikes: +${breakdown.time_spikes} points</li>`;
                    }
                    breakdownHtml += '</ul></div>';
                }
                
                detailsEl.innerHTML = `
                    <div class="grid grid-cols-2 gap-4">
                        <div>Fullscreen Exits: <strong>${data.details.fullscreen_exits}</strong></div>
                        <div>Tab Switches: <strong>${data.details.tab_switches || 0}</strong></div>
                        <div>Focus Lost Events: <strong>${data.details.focus_lost_count}</strong></div>
                        <div>Time Spikes: <strong>${data.details.time_spikes}</strong></div>
                        <div>Total Events: <strong>${data.details.total_events}</strong></div>
                    </div>
                    ${breakdownHtml}
                `;
            } catch (error) {
                console.error('Error loading risk score:', error);
            }
        }

        async function loadLogs(userId, sessionId) {
            try {
                const response = await fetch(`/api/admin/logs/${userId}?session_id=${sessionId}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                const data = await response.json();
                const logs = data.logs;

                // Display event log
                const eventLogEl = document.getElementById('event-log');
                eventLogEl.innerHTML = '';
                
                if (logs.length === 0) {
                    eventLogEl.innerHTML = '<p class="text-gray-500">No events found</p>';
                    return;
                }

                logs.forEach(log => {
                    const logEntry = document.createElement('div');
                    logEntry.className = 'mb-2 p-2 bg-white rounded border-l-4';
                    
                    if (log.event_type === 'FULLSCREEN_EXIT') {
                        logEntry.classList.add('border-red-500');
                    } else if (log.event_type === 'FOCUS_LOST') {
                        logEntry.classList.add('border-yellow-500');
                    } else {
                        logEntry.classList.add('border-blue-500');
                    }

                    const timestamp = new Date(log.timestamp).toLocaleString();
                    logEntry.innerHTML = `
                        <div class="flex justify-between">
                            <span class="font-semibold">${log.event_type}</span>
                            <span class="text-sm text-gray-600">${timestamp}</span>
                        </div>
                        ${log.event_data ? `<div class="text-sm text-gray-600 mt-1">${JSON.stringify(log.event_data)}</div>` : ''}
                    `;
                    eventLogEl.appendChild(logEntry);
                });

                // Create timeline chart
                createTimelineChart(logs);
            } catch (error) {
                console.error('Error loading logs:', error);
            }
        }

        function createTimelineChart(logs) {
            const ctx = document.getElementById('timeline-chart').getContext('2d');

            // Process logs for timeline
            const activityData = {};
            const fullscreenExits = {};
            const focusLost = {};

            logs.forEach(log => {
                const time = new Date(log.timestamp);
                const minute = Math.floor(time.getTime() / 60000);

                if (log.event_type === 'KEYSTROKE' || log.event_type === 'MOUSE_MOVE') {
                    activityData[minute] = (activityData[minute] || 0) + 1;
                } else if (log.event_type === 'FULLSCREEN_EXIT') {
                    fullscreenExits[minute] = (fullscreenExits[minute] || 0) + 1;
                } else if (log.event_type === 'FOCUS_LOST') {
                    focusLost[minute] = (focusLost[minute] || 0) + 1;
                }
            });

            // Prepare chart data - combine all minutes
            const allMinutes = new Set([
                ...Object.keys(activityData),
                ...Object.keys(fullscreenExits),
                ...Object.keys(focusLost)
            ]);
            const minutes = Array.from(allMinutes).map(Number).sort((a, b) => a - b);
            const labels = minutes.map(m => new Date(m * 60000).toLocaleTimeString());
            const activityValues = minutes.map(m => activityData[m] || 0);
            const fullscreenValues = minutes.map(m => fullscreenExits[m] || null);
            const focusValues = minutes.map(m => focusLost[m] || null);

            // Destroy existing chart
            if (timelineChart) {
                timelineChart.destroy();
            }

            timelineChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Activity Rate (events/min)',
                            data: activityValues,
                            borderColor: 'rgb(59, 130, 246)',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.1,
                            fill: true,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Fullscreen Exits',
                            data: fullscreenValues,
                            borderColor: 'rgb(239, 68, 68)',
                            backgroundColor: 'rgba(239, 68, 68, 0.5)',
                            pointRadius: 8,
                            pointHoverRadius: 10,
                            pointStyle: 'triangle',
                            showLine: false,
                            yAxisID: 'y1'
                        },
                        {
                            label: 'Focus Lost',
                            data: focusValues,
                            borderColor: 'rgb(251, 146, 60)',
                            backgroundColor: 'rgba(251, 146, 60, 0.5)',
                            pointRadius: 8,
                            pointHoverRadius: 10,
                            pointStyle: 'circle',
                            showLine: false,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Events per Minute'
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            beginAtZero: true,
                            max: 1,
                            title: {
                                display: true,
                                text: 'Incidents'
                            },
                            grid: {
                                drawOnChartArea: false
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Time'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        label += context.parsed.y;
                                    }
                                    return label;
                                }
                            }
                        }
                    }
                }
            });
        }

        function closeUserDetails() {
            document.getElementById('user-details').classList.add('hidden');
            selectedUserId = null;
            selectedSessionId = null;
        }

        // Auto-refresh users list every 10 seconds
        setInterval(loadUsers, 10000);
    </script>
</body>
</html>
